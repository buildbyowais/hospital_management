<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | MediCore</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #eef3f6, #f7f9fa);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .error-box {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .error-icon {
            font-size: 80px;
            color: #0b2438;
            margin-bottom: 20px;
        }
        .error-box h1 {
            font-size: 60px;
            font-weight: 700;
            color: #0b2438;
            margin: 0;
        }
        .error-box h2 {
            font-size: 24px;
            color: #1a2b3a;
            margin: 10px 0;
        }
        .error-box p {
            color: #71808d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-home {
            background: #0b2438;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-home:hover {
            background: #123b58;
            color: white;
        }
    </style>
</head>
<body>

    <div class="error-box">
        <div class="error-icon">
            <i class="bi bi-house-door"></i>
        </div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn-home">
            <i class="bi bi-arrow-left"></i> Go Back Home
        </a>
    </div>

</body>
</html>
